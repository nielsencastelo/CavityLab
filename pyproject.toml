[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavitylab"
version = "0.1.0.dev0"
description = "Reproducible, energy-audited simulation of electromagnetic and quantum cavities."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nielsen Castelo Damasceno Dantas" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
quantum = ["qutip>=5.0"]
gpu = ["torch>=2.2"]
dev = ["pytest>=7", "matplotlib>=3.7"]
all = ["matplotlib>=3.7", "qutip>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
